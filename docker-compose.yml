services:
  tuya-matter:
    image: stakach/tuya-matter:latest
    # build: .
    network_mode: host
    restart: unless-stopped
    user: "${MATTER_UID:-1000}:${MATTER_GID:-1000}"
    environment:
      MATTER_PORT: "${MATTER_PORT:-5540}"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
    volumes:
      - type: bind
        source: ./config.yaml
        target: /app/config.yaml
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./matter-data
        target: /data
        bind:
          create_host_path: false
